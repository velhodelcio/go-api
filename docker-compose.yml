services:
  go-app:
    container_name: go-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # O volume sincroniza o codigo da sua maquina com o container
    volumes:
      - .:/go/src/app
    depends_on:
      - go_db
    environment:
      - DB_HOST=go_db
      - DB_PORT=5432

  go_db:
    container_name: go_db
    image: postgres:12
    environment:
      POSTGRES_PASSWORD: 12345
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: